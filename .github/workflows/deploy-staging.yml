name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: countries-api-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: staging
      url: https://staging.api.saeed.sh
    steps:
      - name: Check deployment environment settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          APPLE_APP_ID_PREFIX: ${{ vars.APPLE_APP_ID_PREFIX }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY ALCHEMY_PASSWORD ALCHEMY_STATE_TOKEN APPLE_APP_ID_PREFIX APPLE_BUNDLE_ID; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing GitHub environment setting %s\n' "$name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Restore geographic source snapshot
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: geonames-world-v1-${{ vars.GEONAMES_SNAPSHOT || 'initial' }}
      - run: npm run data:download
      - name: Preserve source snapshot before deployment
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - run: npm run data:build
      - run: npm run data:smoke
      - name: Deploy staging with Alchemy
        run: npm run deploy:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          APPLE_APP_ID_PREFIX: ${{ vars.APPLE_APP_ID_PREFIX }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          STAGING_API_DOMAIN: staging.api.saeed.sh
      - name: Verify staging HTTPS and access control
        run: npm run deploy:verify
        env:
          API_BASE_URL: https://staging.api.saeed.sh
      - name: Save the tested release for production promotion
        uses: actions/upload-artifact@v4
        with:
          name: geographic-release
          retention-days: 7
          if-no-files-found: error
          path: |
            data/generated/latest.json
            data/generated/*/manifest.json
            data/generated/*/search.sql
            data/generated/*/cities/**/*.json
      - name: Record staging release
        run: |
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const {version}=JSON.parse(readFileSync("data/generated/latest.json","utf8")); appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Staging deployed at https://staging.api.saeed.sh\n\nDataset: ${version}\n\nProduction promotion run ID: ${process.env.GITHUB_RUN_ID}\n`);'
